title: Swann Bessa
description: "PhD at Meta FAIR & Ponts, clustering and vector search"
url: "https://swannbessa.github.io"
baseurl: ""

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

author:
  name: Swann Bessa
  email: swann@meta.com
  github: https://github.com/swannbessa
  scholar: https://scholar.google.fr/citations?user=IJrVw5QAAAAJ

social:
  name: Swann Bessa
  links:
    - https://github.com/swannbessa
    - https://scholar.google.fr/citations?user=IJrVw5QAAAAJ

# No external theme — fully custom minimal layout in _layouts/ + assets/style.css
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - README.md

# The e-means playground (e-means-playground.html) is published but unlisted: nothing on the site links to it,
# and this keeps it out of sitemap.xml too. Delete this block to list it.
defaults:
  - scope:
      path: "e-means-playground.html"
    values:
      sitemap: false
