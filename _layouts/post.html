---
layout: default
---
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%-d %B %Y" }}</p>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="back-link"><a href="{{ '/blog/' | relative_url }}">&larr; Back to blog</a></p>
</article>
